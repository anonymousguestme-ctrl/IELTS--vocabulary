<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Word Bench / IELTS 词汇工作台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#"><span class="brand-mark">W/</span><span>WORD BENCH</span></a>
      <div class="topbar-note"><span class="live-dot"></span>本地保存 · 只属于你</div>
    </header>

    <main>
      <section class="intro">
        <div class="kicker">IELTS vocabulary / 01</div>
        <h1>把不会的词，<em>留在手上。</em></h1>
        <p>记录语境，标记掌握。下次通勤，只带走真正需要复习的那一页。</p>
      </section>

      <section class="stats" aria-label="词汇统计">
        <div class="stat"><strong id="totalCount">0</strong><span>总词汇</span></div>
        <div class="stat"><strong id="unknownCount">0</strong><span>待背</span></div>
        <div class="stat"><strong id="masteredCount">0</strong><span>已掌握</span></div>
        <div class="progress-wrap"><div class="progress-label"><span>掌握进度</span><span id="progressText">0%</span></div><div class="progress"><i id="progressBar"></i></div></div>
      </section>

      <section class="workspace">
        <div class="toolbar">
          <div class="tabs" role="tablist">
            <button class="tab active" data-filter="all">全部 <b id="allTabCount">0</b></button>
            <button class="tab" data-filter="unknown">不会 <b id="unknownTabCount">0</b></button>
            <button class="tab" data-filter="mastered">会了 <b id="masteredTabCount">0</b></button>
          </div>
          <div class="toolbar-actions"><label class="search"><span>⌕</span><input id="searchInput" placeholder="搜索单词或意思" /></label><button class="print-btn" id="printBtn"><span>↗</span> 打印当前清单</button></div>
        </div>

        <div class="content-grid">
          <form class="add-panel" id="wordForm">
            <div class="panel-head"><div><div class="eyebrow">ADD A WORD</div><h2 id="formTitle">记下一颗新词</h2></div><span class="plus">＋</span></div>
            <div class="entry-modes" role="tablist"><button type="button" class="entry-mode active" data-kind="word">单词</button><button type="button" class="entry-mode" data-kind="phrase">短语 / 固定搭配</button><button type="button" class="entry-mode" data-kind="sentence">句子</button></div>
            <input type="hidden" name="kind" id="entryKind" value="word" />
            <label><span id="termLabel">单词</span> <input name="word" required id="wordInput" placeholder="例如：substantial" /><small id="lookupStatus">输入后自动查询词性和释义</small><button type="button" id="aiLookupBtn" class="ai-lookup-btn">用 DeepSeek 查询未收录词</button></label>
            <label class="api-key-field">DeepSeek API Key <input type="password" id="deepseekKeyInput" placeholder="粘贴你的 API Key" autocomplete="off" /><div class="api-key-actions"><button type="button" id="saveKeyBtn">保存 Key</button><button type="button" id="clearKeyBtn">清除</button></div><small>仅保存在当前浏览器，不会写入 GitHub</small></label>
            <div class="two-col"><label>词性 <select name="pos" id="posInput"><option value="">自动匹配</option><option>n. 名词</option><option>v. 动词</option><option>adj. 形容词</option><option>adv. 副词</option><option>prep. 介词</option><option>conj. 连词</option><option>phr. 短语</option><option>n. 名词 / v. 动词</option><option>n. 名词 / adj. 形容词</option><option>v. 动词 / adj. 形容词</option><option>其他</option><option>待确认</option></select></label><label>释义 <input name="meaning" id="meaningInput" placeholder="自动匹配，可手动修改" /></label></div>
            <label>常用短语 <textarea name="phrase" rows="2" placeholder="可选：每行一个短语"></textarea></label>
            <label>例句 <textarea name="sentence" rows="3" placeholder="可选：写下一个能让你记住它的句子"></textarea></label>
            <button class="add-btn" id="submitBtn" type="submit"><span>＋</span> 加入词库</button>
            <button class="cancel-edit" id="cancelEditBtn" type="button" hidden>取消编辑</button>
            <p class="form-hint">按 Enter 可快速提交 · 内容自动保存</p>
          </form>

          <div class="list-panel"><div class="list-head"><div><div class="eyebrow">YOUR WORDS</div><h2 id="listTitle">全部词汇</h2></div><div class="list-head-actions"><button class="hide-all-btn" id="hideAllBtn" type="button">隐藏释义</button><span class="result-count" id="resultCount">0 个词</span></div></div><div id="wordList" class="word-list"></div><div id="emptyState" class="empty" hidden><div class="empty-icon">◌</div><p>这里还没有符合条件的词。</p><button id="showAllBtn">显示全部</button></div></div>
        </div>
      </section>
    </main>
    <footer><span>WORD BENCH</span><span>IELTS · COMMUTE EDITION</span></footer>
  </div>
  <script src="ielts-dictionary.js"></script>
  <script src="repo-ielts-dictionary.js"></script>
  <script src="hf-ielts-dictionary.js"></script>
  <script src="app.js"></script>
</body>
</html>
